name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install root dependencies
        shell: cmd
        run: npm ci

      - name: Install Playwright browser
        shell: cmd
        run: npx playwright install chromium

      - name: Install package dependencies
        shell: pwsh
        run: |
          foreach ($dir in @("vllm-manager", "llama-manager", "service-entry", "search-gateway", "platform-mcp")) {
            if (Test-Path "$dir/package-lock.json") {
              Push-Location $dir
              npm ci
              if ($LASTEXITCODE -ne 0) { throw "npm ci failed in $dir" }
              Pop-Location
            }
          }

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install TTS test dependencies
        run: python -m pip install -r tts-platform/requirements-gateway.txt

      - name: Run tests
        shell: cmd
        env:
          REQUIRE_TTS_TESTS: "1"
        run: test-all.cmd
