<!doctype html>
<!-- Server-rendered error page (service-entry/lib/public-errors.js). No script and no inline style: every value is escaped on the server, and the page is styled by the portal stylesheet only. -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>{{status}} {{title}}</title>
{{stylesheets}}
</head>
<body class="error-page">
<main class="error-card" aria-labelledby="error-title">
<p class="error-status">{{statusLabel}} {{status}}</p>
<h1 id="error-title">{{title}}</h1>
<p class="error-explanation">{{explanation}}</p>
<h2 class="error-steps-title">{{stepsLabel}}</h2>
<ol class="error-steps">
{{steps}}
</ol>
<dl class="error-meta">
<dt>{{codeLabel}}</dt>
<dd><code>{{code}}</code></dd>
<dt>{{requestIdLabel}}</dt>
<dd><code>{{requestId}}</code></dd>
</dl>
<nav class="error-links" aria-label="{{linksLabel}}">
<a href="{{statusHref}}">{{statusLinkLabel}}</a>
<a href="{{docsHref}}">{{docsLinkLabel}}</a>
<a href="/">{{homeLinkLabel}}</a>
</nav>
</main>
</body>
</html>
