<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>服务发布配置</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f6fb;
      --surface: #fff;
      --surface-2: #eef3f7;
      --line: #d9e2ea;
      --ink: #14202b;
      --muted: #607284;
      --blue: #2563eb;
      --teal: #0f9f8f;
      --green: #16a34a;
      --amber: #d97706;
      --red: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a1017;
        --surface: #111923;
        --surface-2: #192432;
        --line: #2b3a4a;
        --ink: #e9f0f8;
        --muted: #9aaec0;
        --blue: #6aa4ff;
        --teal: #2dd4bf;
        --green: #4ade80;
        --amber: #fbbf24;
        --red: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }
    main {
      width: min(1160px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0;
      display: grid;
      gap: 18px;
    }
    header, .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(26px, 4vw, 36px); }
    h2 { font-size: 20px; }
    h3 { font-size: 17px; }
    p { color: var(--muted); line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    button, .button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary, .button.primary { color: #fff; border-color: var(--blue); background: var(--blue); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .nav { display: flex; flex-wrap: wrap; gap: 9px; }
    .card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      display: grid;
      gap: 15px;
    }
    .badge {
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge.ok { color: var(--green); }
    .badge.warn { color: var(--amber); }
    .scope-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 13px;
    }
    .scope {
      min-width: 0;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      display: grid;
      align-content: start;
      gap: 12px;
    }
    .scope.active { border-color: color-mix(in srgb, var(--green) 50%, var(--line)); }
    .scope.preview { border-color: color-mix(in srgb, var(--amber) 52%, var(--line)); }
    .endpoint-list { display: grid; gap: 9px; }
    .endpoint {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
    }
    code {
      min-height: 44px;
      display: grid;
      gap: 3px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    code strong { color: var(--muted); font-family: inherit; font-size: 11px; }
    code span { font-size: 12px; }
    .message {
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .message.warn { border-color: color-mix(in srgb, var(--amber) 50%, var(--line)); }
    .message.ok { border-color: color-mix(in srgb, var(--green) 45%, var(--line)); }
    form { display: grid; gap: 8px; }
    label { font-size: 13px; font-weight: 700; }
    .input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }
    input {
      min-height: 42px;
      width: 100%;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--ink);
      font: inherit;
    }
    .empty { min-height: 320px; display: grid; place-items: center; color: var(--muted); }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      opacity: 0;
      transition: 160ms ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 940px) { .scope-grid { grid-template-columns: 1fr; } }
    @media (max-width: 620px) {
      header { display: grid; }
      .nav, .nav .button { width: 100%; }
      .input-row { grid-template-columns: 1fr; }
      .endpoint { grid-template-columns: 1fr; }
      .endpoint button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>服务发布配置</h1>
        <p>本机、局域网和可选公网地址在这里集中展示；账号登录和 API Key 请到独立的反代配置页。</p>
      </div>
      <nav class="nav">
        <a class="button" href="/">返回总览</a>
        <a class="button primary" href="/subscription-login.html">反代账号配置</a>
      </nav>
    </header>
    <section class="card">
      <div class="head">
        <div>
          <h2>统一网关发布范围</h2>
          <p>局域网地址始终按本机实际 IP 预先显示；黄色“待启用”表示地址已算出，但服务仍只监听本机。</p>
        </div>
        <span class="badge" id="modeBadge">读取中</span>
      </div>
      <div id="panel"><div class="empty">正在生成三组服务地址…</div></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const panel = document.querySelector("#panel");
    const modeBadge = document.querySelector("#modeBadge");
    const toast = document.querySelector("#toast");

    document.addEventListener("click", async (event) => {
      const copy = event.target.closest("[data-copy]");
      if (!copy) return;
      const value = copy.getAttribute("data-copy") || "";
      try {
        await navigator.clipboard.writeText(value);
        showToast("已复制");
      } catch {
        showToast(value);
      }
    });
    document.addEventListener("submit", savePublicBaseUrl);

    refresh();

    async function refresh() {
      try {
        const response = await fetch("/api/subscription-service", {
          cache: "no-store",
          signal: AbortSignal.timeout(6000),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "服务发布状态不可用。");
        render(data);
      } catch (error) {
        panel.innerHTML = `<div class="message warn">${escapeHtml(error.message)}</div>`;
      }
    }

    function render(data) {
      modeBadge.textContent = data.lan?.active ? "局域网模式已启用" : "当前仅本机";
      modeBadge.className = `badge ${data.lan?.active ? "ok" : "warn"}`;
      panel.innerHTML = `
        <div class="scope-grid">
          <section class="scope active">
            <div class="head">
              <div>
                <h3>本机</h3>
                <p>${escapeHtml(data.local?.baseUrl || "")}</p>
              </div>
              <span class="badge ok">已启用</span>
            </div>
            ${endpointList(data.local?.endpoints)}
          </section>
          <section class="scope ${data.lan?.active ? "active" : "preview"}">
            <div class="head">
              <div>
                <h3>局域网</h3>
                <p>${escapeHtml(data.lan?.baseUrl || "")}</p>
              </div>
              <span class="badge ${data.lan?.active ? "ok" : "warn"}">${data.lan?.active ? "已启用" : "地址预览 · 待启用"}</span>
            </div>
            ${endpointList(data.lan?.endpoints)}
            ${data.lan?.active ? `
              <div class="message ok">统一入口已监听局域网。请在防火墙中只允许可信网段，并始终使用 API Key。</div>
            ` : `
              <div class="message warn">要让其它设备访问，请在终端运行下面的重启命令：</div>
              <div class="endpoint">
                <code><strong>LAN 启动命令</strong><span>${escapeHtml(data.lan?.startCommand || "")}</span></code>
                <button type="button" data-copy="${escapeHtml(data.lan?.startCommand || "")}">复制</button>
              </div>
            `}
          </section>
          <section class="scope ${data.public?.configured ? "active" : "preview"}">
            <div class="head">
              <div>
                <h3>可选公网</h3>
                <p>${data.public?.configured ? escapeHtml(data.public.baseUrl) : "填写你的 HTTPS 域名后立即生成地址"}</p>
              </div>
              <span class="badge ${data.public?.configured ? "ok" : "warn"}">${data.public?.configured ? "地址已配置" : "未配置"}</span>
            </div>
            <form id="publicForm">
              <label for="publicBaseUrl">公网 HTTPS 基础地址</label>
              <div class="input-row">
                <input
                  id="publicBaseUrl"
                  name="publicBaseUrl"
                  type="url"
                  inputmode="url"
                  placeholder="https://ai.example.com"
                  value="${escapeHtml(data.public?.baseUrl || "")}"
                  ${data.localControl ? "" : "disabled"}
                />
                <button class="primary" type="submit" ${data.localControl ? "" : "disabled"}>保存并生成</button>
              </div>
            </form>
            ${data.public?.configured ? endpointList(data.public.endpoints) : ""}
            <div class="message warn">
              这里只保存并展示公开地址，不会自动创建域名、HTTPS、隧道或防火墙规则。真正公网发布前必须另行配置可信反向代理或隧道。
            </div>
            ${data.localControl ? "" : `<p>通过局域网打开时只能查看，请回到服务机的 127.0.0.1 页面修改。</p>`}
          </section>
        </div>
      `;
    }

    async function savePublicBaseUrl(event) {
      if (!(event.target instanceof HTMLFormElement) || event.target.id !== "publicForm") return;
      event.preventDefault();
      const button = event.target.querySelector("button[type='submit']");
      const publicBaseUrl = event.target.elements.publicBaseUrl.value.trim();
      button.disabled = true;
      try {
        const response = await fetch("/api/subscription-service/public-base-url", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ publicBaseUrl }),
          signal: AbortSignal.timeout(8000),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "公网地址保存失败。");
        render(data);
        showToast(publicBaseUrl ? "公网地址已保存" : "公网地址已清除");
      } catch (error) {
        showToast(error.message);
        button.disabled = false;
      }
    }

    function endpointList(endpoints) {
      if (!endpoints) return `<div class="message">暂无地址。</div>`;
      const labels = { openAi: "OpenAI", claude: "Claude", codex: "Codex", openCode: "OpenCode" };
      return `
        <div class="endpoint-list">
          ${Object.entries(endpoints).map(([protocol, value]) => `
            <div class="endpoint">
              <code><strong>${escapeHtml(labels[protocol] || protocol)}</strong><span>${escapeHtml(value)}</span></code>
              <button type="button" data-copy="${escapeHtml(value)}">复制</button>
            </div>
          `).join("")}
        </div>
      `;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[char]));
    }
  </script>
</body>
</html>
