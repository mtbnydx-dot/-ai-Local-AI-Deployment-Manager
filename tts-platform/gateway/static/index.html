<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语音克隆聚合平台</title>
<style>
  :root {
    --bg: #0f1420; --card: #171e2e; --card2: #1e2740; --line: #2a3550;
    --text: #e8ecf5; --muted: #8b96ad; --accent: #4f8cff; --accent2: #38d39f;
    --err: #ff6b6b; --warn: #ffb454;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin-bottom: 12px; color: var(--accent); }
  .card h2 .hint { color: var(--muted); font-weight: normal; font-size: 12px; margin-left: 8px; }
  textarea { width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 14px; min-height: 80px; resize: vertical; font-family: inherit; }
  input[type=text] { background: var(--card2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  button:disabled { background: #33405e; color: var(--muted); cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button.rec { background: var(--err); }
  button.small { padding: 5px 10px; font-size: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .engines { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .engine { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .engine.off { opacity: 0.45; cursor: not-allowed; }
  .engine input { accent-color: var(--accent); width: 16px; height: 16px; }
  .engine .nm { font-size: 13px; }
  .engine .st { font-size: 11px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.on { background: var(--accent2); } .dot.off { background: var(--err); }
  .voice { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; display: flex; align-items: center; gap: 10px; }
  .voice.sel { border-color: var(--accent); }
  .voice .nm { font-size: 13px; flex: 1; }
  .result { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 10px; }
  .result .hd { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
  .result audio { width: 100%; height: 36px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #24314f; color: var(--accent); }
  .msg { font-size: 13px; margin-top: 8px; }
  .msg.err { color: var(--err); } .msg.ok { color: var(--accent2); } .msg.warn { color: var(--warn); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  label.fld { font-size: 12px; color: var(--muted); display: block; margin: 10px 0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ 语音克隆聚合平台</h1>
  <div class="sub">中文输入 → 英文翻译 → 用你的声音说英文 ｜ Fish S2 Pro · Chatterbox V3 · Step-Audio-EditX · Qwen3-TTS · 小米 MiMo API</div>

  <div class="card">
    <h2>① 引擎状态 <span class="hint">本地引擎需先启动对应 worker（见 README）</span>
      <button class="ghost small" style="float:right" onclick="loadEngines()">刷新</button></h2>
    <div class="engines" id="engines"></div>
  </div>

  <div class="card">
    <h2>② 我的音色 <span class="hint">录一段 10~20 秒的中文朗读，并填写朗读的文字（Step 引擎必填，其他引擎也会更准）</span></h2>
    <div class="row">
      <button id="recBtn" onclick="toggleRec()">🎤 开始录音</button>
      <span>或</span>
      <input type="file" id="fileInput" accept="audio/*" style="color:var(--muted);font-size:13px">
      <span id="recState" class="msg"></span>
    </div>
    <label class="fld">音色名称</label>
    <input type="text" id="voiceName" value="我的声音" style="width:240px">
    <label class="fld">参考音频的文字内容（你朗读的原文）</label>
    <textarea id="refText" placeholder="例如：大家好，我叫……今天我来介绍一下我的摄影作品。"></textarea>
    <div class="row" style="margin-top:10px">
      <button onclick="saveVoice()" id="saveVoiceBtn">保存音色</button>
      <span id="voiceMsg" class="msg"></span>
    </div>
    <div id="voiceList"></div>
  </div>

  <div class="card">
    <h2>③ 文本 <span class="hint">输入中文 → 翻译 → 可手动修改英文后再合成</span></h2>
    <label class="fld">中文原文</label>
    <textarea id="zhText" placeholder="输入你想说的中文……"></textarea>
    <div class="row" style="margin-top:10px">
      <button onclick="doTranslate()" id="transBtn">翻译成英文 →</button>
      <span id="transMsg" class="msg"></span>
    </div>
    <label class="fld">英文文本（最终合成内容，可编辑）</label>
    <textarea id="enText" placeholder="English text to synthesize..."></textarea>
    <div class="row" style="margin-top:8px">
      <button class="ghost small" onclick="insertPause()">⏸ 在光标处插入停顿</button>
      <span class="st" style="color:var(--muted);font-size:12px">停顿标记 ⏸ 所有引擎都支持（Fish 最精准）</span>
    </div>
  </div>

  <div class="card">
    <h2>④ 生成语音</h2>
    <div class="row" style="margin-bottom:12px">
      <div>
        <label class="fld" style="margin-top:0">语速 <span id="speedVal">1.0×</span>（全部引擎）</label>
        <input type="range" id="speed" min="0.5" max="1.5" step="0.05" value="1.0" style="width:200px;accent-color:var(--accent)"
               oninput="document.getElementById('speedVal').textContent = parseFloat(this.value).toFixed(2) + '×'">
      </div>
      <div>
        <label class="fld" style="margin-top:0">语气（Fish / Chatterbox / 小米）</label>
        <select id="emotion" style="background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px">
          <option value="">默认</option>
          <option>开心</option><option>兴奋</option><option>平静</option>
          <option>悲伤</option><option>生气</option><option>耳语</option>
        </select>
      </div>
      <div style="flex:1;min-width:220px">
        <label class="fld" style="margin-top:0">风格描述（仅小米引擎，可任意描述）</label>
        <input type="text" id="style" placeholder="如：像新闻播音员一样字正腔圆 / 温柔地慢慢说" style="width:100%">
      </div>
    </div>
    <div class="row">
      <button onclick="generate()" id="genBtn" style="background:var(--accent2);color:#04120c;font-weight:600">🔊 用选中的引擎生成</button>
      <span id="genMsg" class="msg"></span>
    </div>
    <div id="results"></div>
  </div>
</div>

<script>
let engines = [], selectedEngines = new Set(), voices = [], selectedVoice = null;
let mediaRecorder = null, chunks = [], recordedBlob = null;
let sessionApiKey = sessionStorage.getItem('ttsGatewayApiKey') || '';

const pageBase = new URL(
  window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/',
  window.location.origin,
);

function apiUrl(path) {
  return new URL(String(path || '').replace(/^\/+/, ''), pageBase).toString();
}

function resourceUrl(path) {
  const value = String(path || '');
  return value.startsWith('/') ? new URL(value, window.location.origin).toString() : apiUrl(value);
}

async function apiFetch(path, options = {}, allowPrompt = true) {
  const headers = new Headers(options.headers || {});
  if (sessionApiKey) headers.set('Authorization', `Bearer ${sessionApiKey}`);
  const response = await fetch(resourceUrl(path), { ...options, headers });
  if (response.status === 401 && allowPrompt) {
    const entered = window.prompt('统一入口需要客户端 API Key。本页只在当前标签会话中保存。', '');
    if (entered && entered.trim()) {
      sessionApiKey = entered.trim();
      sessionStorage.setItem('ttsGatewayApiKey', sessionApiKey);
      return apiFetch(path, options, false);
    }
  }
  return response;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[char]);
}

async function loadProtectedAudio(audio, path) {
  const response = await apiFetch(path);
  if (!response.ok) throw new Error(`音频读取失败: HTTP ${response.status}`);
  const objectUrl = URL.createObjectURL(await response.blob());
  audio.src = objectUrl;
  audio.addEventListener('emptied', () => URL.revokeObjectURL(objectUrl), { once: true });
  return objectUrl;
}

async function loadEngines() {
  const el = document.getElementById('engines');
  el.innerHTML = '<span class="spinner"></span>';
  try {
    const response = await apiFetch('api/engines');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    engines = await response.json();
  } catch (e) { el.innerHTML = '<span class="msg err">无法连接网关</span>'; return; }
  el.innerHTML = '';
  for (const en of engines) {
    const div = document.createElement('div');
    div.className = 'engine' + (en.available ? '' : ' off');
    const checked = en.available && selectedEngines.has(en.id);
    div.innerHTML = `<input type="checkbox" ${checked?'checked':''} ${en.available?'':'disabled'}>
      <span class="dot ${en.available?'on':'off'}"></span>
      <div><div class="nm">${escapeHtml(en.name)}</div>
      <div class="st">${en.available ? '可用' : '未启动 / 未配置'}</div></div>`;
    if (en.available) {
      div.onclick = (ev) => {
        const cb = div.querySelector('input');
        if (ev.target !== cb) cb.checked = !cb.checked;
        cb.checked ? selectedEngines.add(en.id) : selectedEngines.delete(en.id);
      };
    }
    el.appendChild(div);
  }
}

async function loadVoices() {
  const response = await apiFetch('api/voices');
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  voices = await response.json();
  if (voices.length && !selectedVoice) selectedVoice = voices[0].id;
  const el = document.getElementById('voiceList');
  el.innerHTML = '';
  for (const v of voices) {
    const div = document.createElement('div');
    div.className = 'voice' + (v.id === selectedVoice ? ' sel' : '');
    div.innerHTML = `<input type="radio" name="vsel" ${v.id===selectedVoice?'checked':''}>
      <span class="nm">${escapeHtml(v.name)} <span style="color:var(--muted)">${v.ref_text ? '（有文字）' : '（无文字）'}</span></span>
      <audio controls preload="none" style="height:30px;max-width:220px"></audio>
      <button class="ghost small" onclick="delVoice('${v.id}', event)">删除</button>`;
    div.onclick = (ev) => { if (ev.target.tagName !== 'BUTTON' && ev.target.tagName !== 'AUDIO') { selectedVoice = v.id; loadVoices(); } };
    el.appendChild(div);
    loadProtectedAudio(div.querySelector('audio'), `api/voices/${encodeURIComponent(v.id)}/audio`)
      .catch(error => { div.querySelector('audio').title = error.message; });
  }
}

async function delVoice(id, ev) {
  ev.stopPropagation();
  await apiFetch('api/voices/' + encodeURIComponent(id), { method: 'DELETE' });
  if (selectedVoice === id) selectedVoice = null;
  loadVoices();
}

async function toggleRec() {
  const btn = document.getElementById('recBtn'), st = document.getElementById('recState');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop(); return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(chunks, { type: mediaRecorder.mimeType });
      stream.getTracks().forEach(t => t.stop());
      btn.textContent = '🎤 重新录音'; btn.classList.remove('rec');
      st.textContent = `已录制 ${(recordedBlob.size/1024).toFixed(0)} KB，点击"保存音色"`; st.className = 'msg ok';
    };
    mediaRecorder.start();
    btn.textContent = '⏹ 停止录音'; btn.classList.add('rec');
    st.textContent = '录音中……建议 10~20 秒'; st.className = 'msg warn';
  } catch (e) { st.textContent = '无法访问麦克风: ' + e.message; st.className = 'msg err'; }
}

async function saveVoice() {
  const msg = document.getElementById('voiceMsg');
  const file = document.getElementById('fileInput').files[0];
  const blob = file || recordedBlob;
  if (!blob) { msg.textContent = '请先录音或选择音频文件'; msg.className = 'msg err'; return; }
  const fd = new FormData();
  fd.append('file', blob, file ? file.name : 'rec.webm');
  fd.append('name', document.getElementById('voiceName').value || '我的声音');
  fd.append('ref_text', document.getElementById('refText').value || '');
  msg.innerHTML = '<span class="spinner"></span>';
  const r = await apiFetch('api/voices', { method: 'POST', body: fd });
  if (r.ok) {
    const v = await r.json(); selectedVoice = v.id;
    msg.textContent = '已保存 ✓'; msg.className = 'msg ok';
    recordedBlob = null; document.getElementById('fileInput').value = '';
    loadVoices();
  } else {
    msg.textContent = '保存失败: ' + (await r.text()).slice(0, 200); msg.className = 'msg err';
  }
}

async function doTranslate() {
  const msg = document.getElementById('transMsg'), btn = document.getElementById('transBtn');
  const text = document.getElementById('zhText').value.trim();
  if (!text) { msg.textContent = '请先输入中文'; msg.className = 'msg err'; return; }
  btn.disabled = true; msg.innerHTML = '<span class="spinner"></span> 翻译中……'; msg.className = 'msg';
  try {
    const r = await apiFetch('api/translate', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ text }) });
    const data = await r.json();
    if (r.ok) { document.getElementById('enText').value = data.english; msg.textContent = `完成（${data.model}）`; msg.className = 'msg ok'; }
    else { msg.textContent = data.detail || JSON.stringify(data); msg.className = 'msg err'; }
  } catch (e) { msg.textContent = e.message; msg.className = 'msg err'; }
  btn.disabled = false;
}

async function generate() {
  const msg = document.getElementById('genMsg');
  const text = document.getElementById('enText').value.trim();
  if (!text) { msg.textContent = '英文文本为空（先翻译或直接输入英文）'; msg.className = 'msg err'; return; }
  if (selectedEngines.size === 0) { msg.textContent = '请至少勾选一个可用引擎'; msg.className = 'msg err'; return; }
  const needVoice = [...selectedEngines].some(e => e !== 'qwen_api');
  if (needVoice && !selectedVoice) { msg.textContent = '请先保存并选择一个音色'; msg.className = 'msg err'; return; }
  msg.textContent = '';
  const results = document.getElementById('results');
  for (const engine of selectedEngines) {
    const en = engines.find(x => x.id === engine);
    const div = document.createElement('div');
    div.className = 'result';
    div.innerHTML = `<div class="hd"><span class="tag">${escapeHtml(en ? en.name : engine)}</span>
      <span class="st"><span class="spinner"></span> 合成中……（首次调用要加载模型，可能等几分钟）</span></div>`;
    results.prepend(div);
    apiFetch('api/tts', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ engine, text, voice_id: selectedVoice, language: 'en',
        speed: parseFloat(document.getElementById('speed').value),
        emotion: document.getElementById('emotion').value,
        style: document.getElementById('style').value.trim() }) })
      .then(async r => {
        const data = await r.json();
        if (r.ok) {
          const audioResponse = await apiFetch(data.url);
          if (!audioResponse.ok) throw new Error(`音频读取失败: HTTP ${audioResponse.status}`);
          const audioUrl = URL.createObjectURL(await audioResponse.blob());
          div.innerHTML = `<div class="hd"><span class="tag">${escapeHtml(en ? en.name : engine)}</span>
            <span style="color:var(--muted);font-size:12px">${(data.elapsed_ms/1000).toFixed(1)}s ·
            <a href="${audioUrl}" download style="color:var(--accent)">下载</a></span></div>
            <audio controls src="${audioUrl}"></audio>`;
        } else {
          div.innerHTML = `<div class="hd"><span class="tag">${escapeHtml(en ? en.name : engine)}</span></div>
            <div class="msg err">${(data.detail || JSON.stringify(data)).slice(0, 400)}</div>`;
        }
      })
      .catch(e => { div.innerHTML += `<div class="msg err">${e.message}</div>`; });
  }
}

function insertPause() {
  const ta = document.getElementById('enText');
  const pos = ta.selectionStart ?? ta.value.length;
  ta.value = ta.value.slice(0, pos) + ' ⏸ ' + ta.value.slice(pos);
  ta.focus(); ta.selectionStart = ta.selectionEnd = pos + 3;
}

loadEngines(); loadVoices();
</script>
</body>
</html>
