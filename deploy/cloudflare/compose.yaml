# Cloudflare Tunnel connector for the PUBLIC listener (05-public.md section 14).
# This is a template: scripts/setup-public.ps1 and /api/public/templates render it
# into <AI_ROOT>/config/public/ (untracked). Lines between "# @if" and "# @end"
# belong to one tunnel mode only; the renderer keeps the block that matches.
name: cloudflared-public

services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE}
    container_name: cloudflared-public
    restart: unless-stopped
    # @if token
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    env_file:
      - ${PUBLIC_CONFIG_DIR}/cloudflared.env
    # @end
    # @if config
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --config /etc/cloudflared/config.yml run
    volumes:
      - ${PUBLIC_CONFIG_DIR}/:/etc/cloudflared:ro
    # @end
    ports:
      - "127.0.0.1:20241:2000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
